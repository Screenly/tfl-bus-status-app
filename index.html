<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TfL Bus Status - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
      padding="0"
    >
      <div id="app">
        <header class="masthead">
          <div class="stop">
            <div class="flag" data-letter hidden></div>
            <div class="stop-text">
              <div class="eyebrow">Bus stop</div>
              <h1 class="stop-name" data-stop-name>&nbsp;</h1>
              <div class="towards" data-towards>&nbsp;</div>
            </div>
          </div>
          <div class="now">
            <div class="clock" data-clock>&nbsp;</div>
            <div class="freshness" data-freshness>&nbsp;</div>
          </div>
        </header>

        <div class="notice" data-notice role="status" hidden></div>

        <main class="board" data-board></main>

        <div class="details" data-details role="status" hidden></div>

        <footer class="credit">
          <span>Powered by TfL Open Data</span>
          <span data-routes></span>
        </footer>
      </div>
    </auto-scaler>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
