---
syntax: manifest_v1
description: |
  Displays TFL Bus Status for a given bus stop.
  You can find the list of all bus stops here:
  https://playground.srly.io/edge-apps/helpers/tfl/bus-stop-lookup/
icon: https://playground.srly.io/edge-apps/icons/tfl-bus-status.svg
author: Screenly, Inc.
categories:
  - Utilities
  - Dashboards
ready_signal: true
settings:
  tfl_api_token:
    type: secret
    title: TFL API Key
    optional: false
    is_global: true
    help_text: |
      Enter your TFL API key to access Transport for London data.
      You can get your API key from https://api-portal.tfl.gov.uk/.
  stop_id:
    type: string
    default_value: 490005186S1
    title: Bus Stop ID
    optional: false
    help_text: |
      Enter the bus stop ID for the location you want to display.
      You can find your bus stop ID using the lookup tool at https://playground.srly.io/edge-apps/helpers/tfl/bus-stop-lookup/
  sentry_dsn:
    type: secret
    title: Sentry Client Key
    optional: true
    is_global: true
    help_text: |
      Enter your Sentry DSN to enable error tracking and monitoring.
  theme:
    type: string
    default_value: light
    title: Theme
    optional: true
    help_text:
      schema_version: 1
      properties:
        type: select
        help_text: |
          Light suits a bus shelter or a bright lobby; dark suits a dim hall or a screen that runs through the night.
        options:
          - label: Light
            value: light
          - label: Dark
            value: dark
